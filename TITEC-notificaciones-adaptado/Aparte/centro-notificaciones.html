<!doctype html>
<html lang="es">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Centro de notificaciones</title>
    <style>
        body{
            font:16px system-ui;
            background:#f3f5f9;
            color:#172033;
            margin:24px
        }
        .box,.item{
            background:white;
            border:1px solid #e0e5ee;
            border-radius:12px;
            padding:18px;
            margin:12px auto;
            max-width:900px
        }
        h1{margin:0}
        label{
            display:block;
            font-size:13px;
            font-weight:bold;
            margin:8px 0 4px
        }
        input{
            box-sizing:border-box;
            width:100%;
            padding:10px;
            border:1px solid #ccd3df;
            border-radius:7px
        }
        .tools{
            display:grid;
            grid-template-columns:2fr 1fr auto auto;
            gap:12px;
            align-items:end
        }
        button{
            padding:10px 13px;
            background:#2458d3;
            color:white;
            border:0;
            border-radius:8px;
            cursor:pointer
        }
        .alt{
            background:#e8edf7;
            color:#172033
        }
        .item{
            display:grid;
            grid-template-columns:1fr auto;
            gap:12px
        }
        .unread{border-left:5px solid #2458d3}
        .title{font-weight:750}
        .unread .title{font-weight:900}
        .meta{
            font-size:12px;
            color:#647086;
            margin:8px 0
        }
        .pill{
            font-size:11px;
            background:#e8edf7;
            border-radius:99px;
            padding:4px 8px;
            height:max-content
        }
        pre{
            white-space:pre-wrap;
            overflow-wrap:anywhere
        }
        @media(max-width:650px){
            body{margin:10px}
            .tools{grid-template-columns:1fr 1fr}
            .item{grid-template-columns:1fr}
        }
    </style>
    
    <main>
        <header class="box">
            <h1>Centro de notificaciones</h1>
            <p>Consulta, marca como leídas o elimina lógicamente las notificaciones del usuario de prueba.</p>
        </header>
        <section class="box tools">
            <div><label>URL backend</label><input id="api" value="http://localhost:3000"></div>
            <div><label>ID usuario</label><input id="uid" value="usr123"></div>
            <button id="refresh">Actualizar</button>
            <button id="all" class="alt">Marcar todas leídas</button>
        </section>
        <p id="status" style="max-width:900px; margin:auto">Cargando notificaciones…</p>
        <section id="list"></section>
        <details class="box">
            <summary>JSON de depuración</summary>
            <pre id="raw">[]</pre>
        </details>
    </main>

    <script>
        const $=id=>document.getElementById(id);
        
        function esc(s){
            return String(s??'').replace(/[&<>"']/g,
                c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
        }
        
        function base(){return $('api').value.replace(/\/$/,'')}
        
        function render(ns){
            $('raw').textContent=JSON.stringify(ns,null,2);
            $('list').innerHTML=ns.length?ns.map(n=>{
                let id=esc(n.id_notificacion),st=n.estado_lectura||n.estado||'NO_LEIDA';
                return `
                    <article class="item ${st==='NO_LEIDA'?'unread':''}">
                        <div>
                            <div class="title">${esc(n.titulo||n.tipo)}</div>
                            <div>${esc(n.mensaje)}</div>
                            <div class="meta">${esc(new Date(n.created_at||n.fecha_emision).toLocaleString('es-CL'))} · Canal: ${esc(n.canal||'APP')}</div>
                            <details>
                                <summary>Ver datos JSON</summary>
                                <pre>${esc(JSON.stringify(n.datos||{},null,2))}</pre>
                            </details>
                            <p>${st==='NO_LEIDA'?`
                                <button onclick="markRead('${id}')">Marcar leída</button>
                                `:''}
                                <button class="alt" onclick="removeOne('${id}')">Eliminar</button>
                            </p>
                        </div>
                        <span class="pill">${esc(st)}</span>
                    </article>
                    `}).join(''):'<div class="box">No hay notificaciones para este usuario.</div>'
        }
                    
        async function load(){
            $('status').textContent='Cargando…';
            try{
                let r=await fetch(base()+'/api/notificaciones?usuarioId='+encodeURIComponent($('uid').value.trim())),
                d=await r.json();
                
                if(!r.ok)throw Error(d.error||'Error en mostrar notificaciones');
                render(d);
                $('status').textContent='Notificaciones cargadas: '+d.length}catch(e){
                    $('status').textContent='Error en mostrar notificaciones: '+e.message;render([])}
        }
        
        async function action(path,method='POST',body){
            try{
                let r=await fetch(base()+path,{
                    method,headers:{'Content-Type':'application/json'},
                    body:body?JSON.stringify(body):undefined}),
                    d=await r.json();
                
                if(!r.ok)throw Error(d.error||'Error');
                await load()
            }
            catch(e){
                $('status').textContent='Error: '+e.message}
        }
        
        window.markRead=id=>action('/api/notificaciones/'+id+'/leida');
        window.removeOne=id=>{
            if(confirm('¿Eliminar? El registro se conserva como ELIMINADA.'))action('/api/notificaciones/'+id,'DELETE')};
        $('refresh').onclick=load;$('all').onclick=()=>action(
            '/api/notificaciones/marcar-todas-leidas','POST',{usuarioId:$('uid').value.trim()});
            load()
    </script>
</html>
